async function simplify(input) {
  await new Promise(r => setTimeout(r, 1800));
  const high   = CLAUSES.filter(c=>c.risk_level==='high').length;
  const medium = CLAUSES.filter(c=>c.risk_level==='medium').length;
  const low    = CLAUSES.filter(c=>c.risk_level==='low').length;
  return { clauses:CLAUSES, counts:{high,medium,low,total:CLAUSES.length} };
}

  return (

            <button onClick={onBack} className="text-brand-600 hover:text-brand-800 text-sm font-medium mr-1 transition-colors" aria-label="Go back to input screen">
              {t.backToInput}

          )}

function SummaryBanner({ counts }) {
  const { t } = useLang();
  return (
    <div className="bg-gradient-to-r from-brand-700 to-brand-600 text-white rounded-2xl p-5 shadow-lg animate-fade-in">
      <p className="text-xs font-semibold uppercase tracking-widest opacity-75 mb-1">{t.resultsTitle}</p>
      <h2 className="text-xl font-bold mb-4">
        {counts.high} high-risk · {counts.medium} medium-risk · {counts.low} low-risk clause{counts.total!==1?'s':''} found
      </h2>
      <div className="flex gap-4 flex-wrap">
        {[['high','⚠','red'],['medium','◉','amber'],['low','✓','green']].map(([level,icon,col])=>(
          <div key={level} className="bg-white/15 rounded-xl px-4 py-2 flex items-center gap-2">
            <span className="text-lg" aria-hidden="true">{icon}</span>
            <div>
              <div className="text-2xl font-bold leading-none">{counts[level]}</div>
              <div className="text-xs opacity-80 capitalize">{t[level]} risk</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function RiskBadge({ level }) {
  const { t } = useLang();
  const s = RISK_STYLES[level];
  return (
    <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full ${s.badge}`} aria-label={`Risk level: ${t[level]}`}>
      <span aria-hidden="true">{s.icon}</span> {t[level]}
    </span>
  );
}

function CategoryTag({ cat }) {
  const { t } = useLang();
  return (
    <span className={`inline-flex items-center text-xs font-medium px-2 py-0.5 rounded border ${CAT_STYLES[cat]||CAT_STYLES['Other']}`}>
      {t.categories?.[cat] || cat}
    </span>
  );
}

function ClauseCard({ clause, lang, onHighlight, active }) {
  const { t } = useLang();
  const [showOrig, setShowOrig] = useState(false);
  const ct = CLAUSE_TRANSLATIONS[lang]?.[clause.id];
  const hasTranslation = lang === 'en' || !!ct;
  const heading = ct?.heading || clause.heading;
  const summary = ct?.summary || (lang !== 'en' ? null : clause.summary);
  return (
    <article
      className={`clause-card bg-white rounded-2xl border p-5 cursor-pointer ${active ? 'ring-2 ring-brand-400' : 'border-slate-200'} animate-fade-in`}
      onClick={()=>onHighlight && onHighlight(clause.id)}
      aria-label={`Clause: ${heading}`}
    >
      <div className="flex flex-wrap items-start justify-between gap-2 mb-3">
        <h3 className="font-semibold text-slate-800 text-base leading-snug">{heading}</h3>
        <div className="flex items-center gap-2 flex-shrink-0">
          <RiskBadge level={clause.risk_level} />
          <CategoryTag cat={clause.category} />
        </div>
      </div>
      <div className="border-l-4 pl-3 mb-3" style={{borderColor: RISK_STYLES[clause.risk_level].dot.replace('bg-','').includes('red')?'#ef4444':clause.risk_level==='medium'?'#f59e0b':'#22c55e', borderLeftColor: clause.risk_level==='high'?'#ef4444':clause.risk_level==='medium'?'#f59e0b':'#22c55e'}}>
        {summary ? (
          <p className="text-slate-700 text-sm leading-relaxed">{summary}</p>
        ) : (
          <p className="text-slate-400 text-sm italic">{t.translationUnavailable}</p>
        )}
      </div>
      <button
        onClick={e=>{e.stopPropagation();setShowOrig(v=>!v);}}
        className="text-xs text-brand-600 hover:text-brand-800 font-medium transition-colors flex items-center gap-1"
        aria-expanded={showOrig}
      >
        <span aria-hidden="true">{showOrig?'▲':'▼'}</span>
        {showOrig ? t.hideOriginal : t.showOriginal}
      </button>
      {showOrig && (
        <div className="mt-3 bg-slate-50 rounded-xl p-3 border border-slate-200 animate-fade-in">
          <p className="text-xs text-slate-500 font-mono leading-relaxed whitespace-pre-wrap">{clause.text}</p>
        </div>
      )}
    </article>
  );
}

function FilterBar({ filter, setFilter, catFilter, setCatFilter }) {
  const { t } = useLang();
  const risks = [
    { key:'all',    label:t.filterAll },
    { key:'high',   label:t.filterHigh },
    { key:'medium', label:t.filterMedium },
    { key:'low',    label:t.filterLow },
  ];
  return (
    <div className="flex flex-wrap gap-2 items-center" role="toolbar" aria-label="Filter controls">
      <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
        {risks.map(r=>(
          <button
            key={r.key}
            onClick={()=>setFilter(r.key)}
            className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${filter===r.key?'bg-white shadow text-brand-700':'text-slate-500 hover:text-slate-700'}`}
            aria-pressed={filter===r.key}
          >{r.label}</button>
        ))}
      </div>
      <select
        value={catFilter}
        onChange={e=>setCatFilter(e.target.value)}
        className="text-sm border border-slate-200 bg-white rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand-400 outline-none"
        aria-label="Filter by category"
      >
        <option value="all">All categories</option>
        {CATEGORIES.map(c=><option key={c} value={c}>{t.categories?.[c]||c}</option>)}
      </select>
    </div>
  );
}

function Spinner({ label }) {
  return (
    <div className="flex flex-col items-center justify-center gap-4 py-16" role="status" aria-label={label}>
      <svg className="spinner w-10 h-10 text-brand-500" viewBox="0 0 24 24" fill="none">
        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      <p className="text-slate-500 text-sm font-medium">{label}</p>
    </div>
  );
}

// ─── Screens ─────────────────────────────────────────────────────────────────

function InputScreen({ onResults }) {
  const { t } = useLang();
  const [text, setText] = useState('');
  const [url, setUrl] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const textareaRef = useRef(null);

  const loadSample = (key) => {
    setText(SAMPLE_TEXTS[key]);
    setError('');
    textareaRef.current?.focus();
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!text.trim()) { setError(t.emptyError); textareaRef.current?.focus(); return; }
    setError('');
    setLoading(true);
    try {
      const result = await simplify(text);
      onResults(result, text);
    } finally { setLoading(false); }
  };

  if (loading) return <Spinner label={t.loading} />;

  return (
    <main className="max-w-3xl mx-auto w-full px-4 py-10">
      <div className="text-center mb-8 animate-fade-in">
        <div className="inline-flex items-center justify-center w-16 h-16 bg-brand-100 rounded-2xl mb-4">
          <span className="text-3xl" aria-hidden="true">📋</span>
        </div>
        <h1 className="text-3xl font-bold text-slate-900 mb-2">{t.appName}</h1>
        <p className="text-slate-500 text-lg">{t.tagline}</p>
      </div>

      <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 animate-fade-in">
        {error && (
          <div className="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm flex items-center gap-2" role="alert">
            <span aria-hidden="true">⚠</span> {error}
          </div>
        )}

        <div className="mb-4">
          <label htmlFor="agreement-text" className="block text-sm font-semibold text-slate-700 mb-1.5">Agreement text</label>
          <textarea
            id="agreement-text"
            ref={textareaRef}
            value={text}
            onChange={e=>{setText(e.target.value);setError('');}}
            placeholder={t.inputPlaceholder}
            rows={10}
            className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 resize-y focus:ring-2 focus:ring-brand-400 focus:border-transparent outline-none transition leading-relaxed"
            aria-required="true"
            aria-describedby={error?"input-error":undefined}
          />
          {error && <span id="input-error" className="sr-only">{error}</span>}
          <p className="text-xs text-slate-400 mt-1">{text.length.toLocaleString()} characters</p>
        </div>

        <div className="mb-4">
          <label htmlFor="agreement-url" className="block text-sm font-semibold text-slate-700 mb-1.5">URL <span className="text-slate-400 font-normal">(optional, coming soon)</span></label>
          <input
            id="agreement-url"
            type="url"
            value={url}
            onChange={e=>setUrl(e.target.value)}
            placeholder={t.urlPlaceholder}
            disabled
            className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-400 bg-slate-50 cursor-not-allowed outline-none"
          />
        </div>

        <div className="flex flex-wrap items-center gap-3 mb-6">
          <span className="text-sm text-slate-500 font-medium">{t.loadSample}</span>
          {['whatsapp','instagram','netflix','flipkart'].map(k=>(
            <button key={k} type="button" onClick={()=>loadSample(k)}
              className="text-xs bg-slate-100 hover:bg-brand-50 hover:text-brand-700 text-slate-600 px-3 py-1.5 rounded-lg font-medium transition-colors capitalize border border-transparent hover:border-brand-200"
              aria-label={`Load ${k} sample agreement`}
            >{k.charAt(0).toUpperCase()+k.slice(1)}</button>
          ))}
        </div>

        <button type="submit"
          className="w-full bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-semibold py-3 rounded-xl text-base transition-colors shadow-md shadow-brand-200 focus:ring-2 focus:ring-brand-400 focus:ring-offset-2 outline-none"
        >
          {t.simplifyBtn} →
        </button>
      </form>

      <div className="mt-8 grid grid-cols-1 sm:grid-cols-3 gap-4 text-center animate-fade-in">
        {[['🔍','Detects risk clauses','Flags high, medium and low risk sections automatically'],['🌐','Plain language','Rewrites legalese into clear, readable summaries'],['🌏','Multilingual','View summaries in English, Hindi and Malayalam']].map(([icon,title,desc])=>(
          <div key={title} className="bg-white rounded-2xl border border-slate-200 p-4">
            <div className="text-2xl mb-2" aria-hidden="true">{icon}</div>
            <h3 className="font-semibold text-slate-800 text-sm mb-1">{title}</h3>
            <p className="text-xs text-slate-500 leading-relaxed">{desc}</p>
          </div>
        ))}
      </div>
    </main>
  );
}

function ResultsScreen({ result, originalText, lang, onOverlay }) {
  const { t } = useLang();
  const [filter, setFilter] = useState('all');
  const [catFilter, setCatFilter] = useState('all');
  const [activeId, setActiveId] = useState(null);

  const filtered = result.clauses.filter(c=>{
    const riskOk = filter==='all' || c.risk_level===filter;
    const catOk  = catFilter==='all' || c.category===catFilter;
    return riskOk && catOk;
  });

  return (
    <main className="max-w-5xl mx-auto w-full px-4 py-8">
      <div className="mb-6"><SummaryBanner counts={result.counts} /></div>

      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div>
          <FilterBar filter={filter} setFilter={setFilter} catFilter={catFilter} setCatFilter={setCatFilter} />
        </div>
        <button
          onClick={onOverlay}
          className="flex items-center gap-2 text-sm bg-white border border-slate-200 hover:border-brand-300 hover:bg-brand-50 text-brand-700 px-4 py-2 rounded-xl font-medium transition-all shadow-sm"
          aria-label="Open side-by-side overlay view"
        >
          <span aria-hidden="true">⧉</span> {t.viewOverlay}
        </button>
      </div>

      {filtered.length === 0 ? (
        <div className="text-center py-16 text-slate-400 animate-fade-in">
          <div className="text-4xl mb-3" aria-hidden="true">🔍</div>
          <p className="font-medium">{t.noResults}</p>
        </div>
      ) : (
        <div className="grid gap-4">
          {filtered.map(c=>(
            <ClauseCard key={c.id} clause={c} lang={lang} active={activeId===c.id} onHighlight={setActiveId} />
          ))}
        </div>
      )}
    </main>
  );
}

function OverlayScreen({ result, originalText, lang, onClose }) {
  const { t } = useLang();
  const [activeId, setActiveId] = useState(null);
  const clauseRefs = useRef({});
  const summaryRefs = useRef({});

  const handleCardClick = (id) => {
    setActiveId(id);
    clauseRefs.current[id]?.scrollIntoView({ behavior:'smooth', block:'center' });
  };

  const paragraphs = originalText.split(/\n+/).filter(Boolean);

  return (
    <main className="max-w-7xl mx-auto w-full px-4 py-6 animate-fade-in">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-bold text-slate-800 text-lg flex items-center gap-2">
          <span aria-hidden="true">⧉</span> {t.overlayTitle}
        </h2>
        <button onClick={onClose} className="text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1 transition-colors" aria-label="Close overlay">
          ✕ Close
        </button>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 h-[calc(100vh-180px)]">
        {/* Left: original */}
        <div className="bg-white rounded-2xl border border-slate-200 flex flex-col overflow-hidden">
          <div className="px-5 py-3 border-b border-slate-100 bg-slate-50 flex items-center gap-2">
            <span className="text-sm font-semibold text-slate-700">📄 {t.originalText}</span>
          </div>
          <div className="flex-1 overflow-y-auto p-5 text-sm text-slate-600 leading-relaxed space-y-3 font-mono">
            {paragraphs.map((p,i)=>{
              const matchedClause = result.clauses.find(c=>p.toLowerCase().includes(c.heading.split(' ')[0].toLowerCase()) || c.text.split(' ').slice(0,5).some(w=>p.toLowerCase().includes(w.toLowerCase())));
              const isActive = matchedClause && activeId===matchedClause.id;
              return (
                <p key={i}
                  ref={el=>{ if(matchedClause) clauseRefs.current[matchedClause.id]=el; }}
                  className={`rounded px-2 py-1 transition-all cursor-pointer ${isActive?'highlighted-clause':'hover:bg-slate-50'}`}
                  onClick={()=>matchedClause && handleCardClick(matchedClause.id)}
                >{p}</p>
              );
            })}
          </div>
        </div>

        {/* Right: summary panel */}
        <div className="bg-white rounded-2xl border border-slate-200 flex flex-col overflow-hidden">
          <div className="px-5 py-3 border-b border-slate-100 bg-brand-50 flex items-center gap-2">
            <span className="text-sm font-semibold text-brand-700">📋 {t.summaryPanel}</span>
            <span className="text-xs text-brand-500 ml-auto">Click a clause to highlight it in the original</span>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {result.clauses.map(c=>(
              <div
                key={c.id}
                ref={el=>{ summaryRefs.current[c.id]=el; }}
                onClick={()=>handleCardClick(c.id)}
                className={`rounded-xl border p-3 cursor-pointer transition-all ${activeId===c.id?'border-brand-400 ring-2 ring-brand-100 bg-brand-50':'border-slate-200 hover:border-brand-200 hover:bg-slate-50'}`}
                role="button"
                aria-pressed={activeId===c.id}
                tabIndex={0}
                onKeyDown={e=>e.key==='Enter'&&handleCardClick(c.id)}
              >
                <div className="flex items-start justify-between gap-2 mb-1">
                  <span className="text-sm font-semibold text-slate-800 leading-snug">{c.heading}</span>
                  <RiskBadge level={c.risk_level} />
                </div>
                {(() => {
                  const ct = CLAUSE_TRANSLATIONS[lang]?.[c.id];
                  const summary = ct?.summary || (lang==='en'?c.summary:null);
                  return summary
                    ? <p className="text-xs text-slate-600 leading-relaxed">{summary}</p>
                    : <p className="text-xs text-slate-400 italic">{t.translationUnavailable}</p>;
                })()}
              </div>
            ))}
          </div>
        </div>
      </div>
    </main>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────

function App() {
  const [lang, setLang] = useState('en');
  const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
  const [screen, setScreen] = useState('input'); // 'input' | 'results' | 'overlay'
  const [result, setResult] = useState(null);
  const [originalText, setOriginalText] = useState('');

  const handleResults = (data, text) => { setResult(data); setOriginalText(text); setScreen('results'); };
  const handleOverlay = () => setScreen('overlay');
  const handleBack    = () => setScreen(screen==='overlay'?'results':'input');

  return (
    <LangContext.Provider value={{ lang, t }}>
      <div className="min-h-screen flex flex-col bg-slate-50">
        <Header lang={lang} setLang={setLang} screen={screen} onBack={handleBack} />
        <div className="flex-1">
          {screen==='input'   && <InputScreen onResults={handleResults} />}
          {screen==='results' && result && <ResultsScreen result={result} originalText={originalText} lang={lang} onOverlay={handleOverlay} />}
          {screen==='overlay' && result && <OverlayScreen result={result} originalText={originalText} lang={lang} onClose={handleBack} />}
        </div>
        <footer className="bg-white border-t border-slate-200 py-4 px-4 mt-auto">
          <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
            <span>© 2024 {t.appName}</span>
            <span className="text-center">⚠ {t.disclaimer}</span>
            <span>v1.0 · Mock data</span>
          </div>
        </footer>
      </div>
    </LangContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
